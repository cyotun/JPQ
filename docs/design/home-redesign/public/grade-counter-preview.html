<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记牌器 · 级牌与逢人配悬浮条效果图</title>
  <style>
    @font-face { font-family: JPQOriginal; src: url("assets/overlay.ttf") format("truetype"); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #131313; color: #ededed; font-family: JPQOriginal, "Microsoft YaHei", sans-serif; }
    button { font: inherit; cursor: pointer; }
    .design-board { max-width: 1200px; margin: 0 auto; padding: 30px 22px 26px; }
    .board-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 28px; font-weight: 400; color: #ffe395; }
    .board-caption { color: #888; font-size: 14px; white-space: nowrap; }
    .intro { margin: 12px 0 35px; color: #979797; font-size: 15px; line-height: 1.6; }
    .example + .example { margin-top: 37px; padding-top: 31px; border-top: 1px solid #2d2d2d; }
    .example-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 17px; }
    h2 { margin: 0; color: #c7c7c7; font-size: 18px; font-weight: 400; }
    .example-heading > span { color: #777; font-size: 13px; }
    .counter-layout { --side-size: 64px; --counter-gap: 9px; display: grid; grid-template-columns: var(--side-size) minmax(0, 1fr) var(--side-size); align-items: start; gap: var(--counter-gap); }
    .counter-button { display: grid; place-items: center; width: 64px; height: 64px; padding: 0; border: 2px solid #080808; border-radius: 50%; background: #ffe395; color: #111; font-size: 24px; }
    .counter-main { display: flex; gap: 0; min-width: 0; height: 66px; padding: 2px; overflow: hidden; border: 2px solid #080808; border-radius: 16px; background: #434343; }
    .rank-grid { display: grid; flex: 0 0 62%; min-width: 0; grid-template-columns: repeat(7,minmax(0,1fr)) minmax(0,1.55fr) repeat(8,minmax(0,1fr)); gap: 1px; border-radius: 12px 0 0 12px; }
    .rank-cell { display: grid; min-width: 0; grid-template-rows: 28px 30px; text-align: center; }
    .rank-title { position: relative; display: flex; align-items: center; justify-content: center; background: linear-gradient(#6d6e6e,#434343); color: #f7f7f7; font-size: clamp(13px,2.25vw,24px); line-height: 1; }
    .rank-title.double-digit { padding-right: 1px; }
    .rank-number { display: flex; align-items: center; justify-content: center; background: #434343; color: #f4f4f4; font-size: clamp(13px,2.25vw,24px); line-height: 1; }
    .rank-number.bomb { color: #ff354b; }
    .rank-number.zero { color: #5f5f5f; }
    .heart-title { color: #ffe395; font-family: Arial, sans-serif; font-size: 21px; }
    .level-badge { position: absolute; right: 0px; top: 0px; width: 0; height: 0; border-top: 6px solid #ffe395; border-left: 6px solid transparent; }
    .flush-indicator { position: relative; flex: 0 0 24px; align-self: stretch; background: linear-gradient(#6d6e6e 0px,#434343 28px,#434343 100%); }
    .flush-indicator img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .records { display: flex; flex: 1; min-width: 0; flex-direction: column; justify-content: space-between; padding-right: 4px; }
    .record { display: flex; flex: 1; min-height: 0; align-items: center; gap: 4px; font-size: 17px; line-height: 1; white-space: nowrap; }
    .seat { display: grid; place-items: center; align-self: stretch; flex: 0 0 18px; background: #484848; font-size: 18px; }
    .record-count { display: grid; place-items: center; align-self: stretch; flex: 0 0 24px; background: #ffe395; color: #111; font-size: 18px; }
    .record-detail { color: #f6f6f6; overflow: hidden; text-overflow: clip; }
    .tip-row { grid-column: 2; display: flex; align-items: center; justify-self: start; gap: 12px; min-height: 34px; max-width: 100%; padding: 4px 9px 4px 12px; border: 1px solid #574e35; border-radius: 8px; background: #272727; }
    .tip-message { color: #e2d3a6; font-size: 15px; white-space: nowrap; }
    .tip-action { flex: 0 0 auto; padding: 3px 4px; border: 0; background: transparent; color: #ffe395; font-size: 15px; white-space: nowrap; }
    .tip-action.ignore { color: #a49d88; }
    #move-tip { padding: 5px 9px; border-radius: 5px; background: #ffe395; color: #111; }
    .design-status { grid-column: 2; color: #8b8b8b; font-size: 13px; min-height: 20px; line-height: 1.5; }
    .design-status:empty { display: none; }
    .legend { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-top: 28px; padding-top: 19px; border-top: 1px solid #2d2d2d; }
    .legend p { margin: 0; color: #aba58f; font-size: 15px; line-height: 1.8; }
    .reset-preview { padding: 9px 14px; border: 1px solid #494431; border-radius: 9px; background: #20201b; color: #b9ae89; font-size: 13px; white-space: nowrap; }
    .behavior { margin: 15px 0 0; color: #777; font-size: 13px; line-height: 1.7; }
    [hidden] { display: none !important; }
    @media (max-width: 1000px) { .record { font-size: 13px; gap: 2px; } .seat { flex-basis: 13px; font-size: 14px; } .record-count { flex-basis: 18px; font-size: 14px; } .counter-layout { --side-size: 48px; --counter-gap: 6px; } .counter-button { width: 48px; height: 48px; font-size: 18px; } .counter-main { height: 60px; } .rank-cell { grid-template-rows: 25px 27px; } .flush-indicator { flex-basis: 22px; background: linear-gradient(#6d6e6e 0px,#434343 25px,#434343 100%); } }
    @media (max-width: 760px) { .design-board { padding: 22px 16px; } .board-heading, .example-heading, .legend { flex-wrap: wrap; gap: 8px; } h1 { font-size: 24px; } .board-caption { font-size: 12px; } .tip-row { gap: 8px; padding: 4px 8px; } .tip-message, .tip-action { font-size: 12px; } }
  </style>
</head>
<body>
  <main class="design-board" data-htmlprd-page-id="jpq.design.grade-counter">
    <header class="board-heading"><h1>记牌器 · 悬浮条效果图</h1><span class="board-caption">设计确认 · 数字均为示例</span></header>
    <p class="intro">本图示例级牌为 8，保留原记牌条的灰色牌格与黑金配色。</p>

    <section class="example" aria-labelledby="normal-heading">
      <div class="example-heading"><h2 id="normal-heading">1、级牌已识别，正常记牌</h2><span>示例：红桃 8 两张，其余花色 8 四张</span></div>
      <div class="counter-layout" aria-label="已识别级牌的悬浮记牌条示例">
        <button class="counter-button" type="button" disabled>隐藏</button>
        <div class="counter-main"><div class="rank-grid"></div><span class="flush-indicator" aria-label="同花顺仍有可能"><img src="assets/straight-flush.svg" alt=""></span><div class="records"></div></div>
        <button class="counter-button" type="button" disabled>重置</button>
      </div>
    </section>

    <section class="example" aria-labelledby="occluded-heading">
      <div class="example-heading"><h2 id="occluded-heading">2、记牌条遮挡级牌区</h2><span>提醒位于主条下方，左侧与条主体对齐</span></div>
      <div class="counter-layout" aria-label="级牌区被遮挡时的提示示例">
        <button class="counter-button" type="button" disabled>隐藏</button>
        <div class="counter-main"><div class="rank-grid"></div><span class="flush-indicator" aria-label="同花顺仍有可能"><img src="assets/straight-flush.svg" alt=""></span><div class="records"></div></div>
        <button class="counter-button" type="button" disabled>重置</button>
        <div class="tip-row" id="grade-tip"><span class="tip-message">级牌区域被遮挡，请挪开记牌器</span><button class="tip-action" type="button" id="move-tip">一键挪开</button><button class="tip-action ignore" type="button" id="ignore-tip">忽略</button></div>
        <div class="design-status" id="design-status" aria-live="polite"></div>
      </div>
    </section>

    <aside class="legend"><p>右上角三角标记当前级牌；♥只计红桃级牌，普通 8 不重复计入。<br>同花顺标识沿用之前的图案与灰底：亮表示尚有可能，排除所有可能后变暗。</p><button class="reset-preview" id="reset-preview" type="button">重新预览提醒</button></aside>
    <p class="behavior">未出现真实牌局和级牌区域前，不显示遮挡提醒。「忽略」持续到停止记牌后重新开始。<br>本页仅展示界面样式；点击提示按钮只演示效果，不操作手机、不读取牌局。</p>
  </main>
  <script>
    const ranks = ["♥", "大", "小", "A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
    // Heart 8 is separate. The ordinary 8 count includes only non-heart suits.
    const counts = [2, 1, 1, 6, 4, 6, 5, 3, 0, 4, 1, 0, 0, 4, 4, 4];
    for (const grid of document.querySelectorAll(".rank-grid")) {
      ranks.forEach((rank, index) => {
        const cell = document.createElement("div");
        cell.className = "rank-cell";
        cell.setAttribute("aria-label", index === 0 ? "红桃 8 逢人配 2 张" : rank === "8" ? "非红桃级牌 8，4 张" : `${rank} ${counts[index]} 张`);
        const title = document.createElement("span");
        title.className = `rank-title${index === 0 ? " heart-title" : rank === "8" ? " level-title" : rank === "10" ? " double-digit" : ""}`;
        title.textContent = rank;
        if (rank === "8") {
          const badge = document.createElement("span");
          badge.className = "level-badge";
          badge.setAttribute("aria-label", "当前级牌");
          title.append(badge);
        }
        const number = document.createElement("span");
        const bomb = index > 2 && counts[index] >= 4;
        number.className = `rank-number${counts[index] === 0 ? " zero" : bomb ? " bomb" : ""}`;
        number.textContent = String(counts[index]);
        cell.append(title, number);
        grid.append(cell);
      });
    }
    const rows = [{ seat: "上", count: "13", detail: "Q · 6 · 77722 · AAA99 · 3" }, { seat: "对", count: "14", detail: "9 · 4 · 小 · 66688 · JJ1010" }, { seat: "下", count: "14", detail: "6 · 99944 · K · J · 10108 · 7" }];
    for (const records of document.querySelectorAll(".records")) {
      for (const row of rows) {
        const container = document.createElement("div");
        container.className = "record";
        for (const [className, value] of [["seat", row.seat], ["record-count", row.count], ["record-detail", row.detail]]) {
          const part = document.createElement("span");
          part.className = className;
          part.textContent = value;
          container.append(part);
        }
        records.append(container);
      }
    }
    const tip = document.getElementById("grade-tip");
    const status = document.getElementById("design-status");
    document.getElementById("ignore-tip").addEventListener("click", () => {
      tip.hidden = true;
      status.textContent = "效果演示：本次记牌已忽略，停止后重新开始才恢复提醒。";
    });
    document.getElementById("move-tip").addEventListener("click", () => {
      tip.hidden = true;
      status.textContent = "效果演示：一键移到不遮挡级牌区的位置，记牌继续。";
    });
    document.getElementById("reset-preview").addEventListener("click", () => {
      tip.hidden = false;
      status.textContent = "";
    });
  </script>
</body>
</html>
